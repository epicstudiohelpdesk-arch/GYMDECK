name: GymDeck Backend CI & Verification Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'infrastructure/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'infrastructure/**'

jobs:
  backend-verification:
    name: Backend TypeCheck, Security, Full Test Matrix & Container Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gymdeck_user
          POSTGRES_PASSWORD: gymdeck_password
          POSTGRES_DB: gymdeck_cloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 20 LTS Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Backend TypeScript Compilation (No Emit)
        working-directory: backend
        run: pnpm run typecheck

      - name: Forensic Secret Leakage Audit
        run: |
          ! grep -rn --exclude-dir=node_modules "DEV_DB_KEY" backend/shared/config/
          ! grep -rn --exclude-dir=node_modules "AWS_SECRET_ACCESS_KEY" backend/
          ! grep -rn --exclude-dir=node_modules "PRIVATE_KEY_MATERIAL" backend/

      - name: Run Full Backend Test Regression Matrix
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://gymdeck_user:gymdeck_password@localhost:5432/gymdeck_cloud?schema=public
          JWT_SECRET: gymdeck_default_dev_jwt_secret_must_be_overridden_in_prod
        run: |
          for f in test/*.test.ts; do
            echo "Running $f..."
            npx tsx "$f" || exit 1
          done

      - name: Verify Production Multi-Stage Dockerfile
        run: |
          docker build -t gymdeck-backend:ci -f infrastructure/docker/Dockerfile.backend backend/
