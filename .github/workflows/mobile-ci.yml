name: GymDeck Mobile CI Pipeline (Owner & Member)

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/owner-mobile/**'
      - 'apps/member-mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/owner-mobile/**'
      - 'apps/member-mobile/**'

jobs:
  mobile-verification:
    name: Mobile TypeCheck & Static Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Owner Mobile TypeScript Compilation (No Emit)
        working-directory: apps/owner-mobile
        run: npm run typecheck

      - name: Validate Member Mobile TypeScript Compilation (No Emit)
        working-directory: apps/member-mobile
        run: npm run typecheck

      - name: Forensic Secret Leakage Audit
        run: |
          ! grep -rn "RESEND_API_KEY" apps/owner-mobile/ apps/member-mobile/
          ! grep -rn "DATABASE_URL" apps/owner-mobile/ apps/member-mobile/
          ! grep -rn "JWT_SECRET" apps/owner-mobile/ apps/member-mobile/
          ! grep -rn "AWS_SECRET_ACCESS_KEY" apps/owner-mobile/ apps/member-mobile/
          ! grep -rn "WHATSAPP_ACCESS_TOKEN" apps/owner-mobile/ apps/member-mobile/
