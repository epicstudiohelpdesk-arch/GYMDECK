name: GymDeck Mobile CI Pipeline (Owner & Member)

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'apps/owner-mobile/**'
      - 'apps/member-mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/owner-mobile/**'
      - 'apps/member-mobile/**'

jobs:
  mobile-verification:
    name: Mobile TypeCheck & Static Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 20 LTS Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Validate Owner Mobile TypeScript Compilation (No Emit)
        working-directory: apps/owner-mobile
        run: pnpm run typecheck

      - name: Validate Member Mobile TypeScript Compilation (No Emit)
        working-directory: apps/member-mobile
        run: pnpm run typecheck

      - name: Forensic Secret Leakage Audit
        run: |
          ! grep -rn --exclude-dir=node_modules --exclude-dir=.expo --exclude-dir=android --exclude-dir=ios "RESEND_API_KEY" apps/owner-mobile/ apps/member-mobile/
          ! grep -rn --exclude-dir=node_modules --exclude-dir=.expo --exclude-dir=android --exclude-dir=ios "DATABASE_URL" apps/owner-mobile/ apps/member-mobile/
          ! grep -rn --exclude-dir=node_modules --exclude-dir=.expo --exclude-dir=android --exclude-dir=ios "JWT_SECRET" apps/owner-mobile/ apps/member-mobile/
          ! grep -rn --exclude-dir=node_modules --exclude-dir=.expo --exclude-dir=android --exclude-dir=ios "AWS_SECRET_ACCESS_KEY" apps/owner-mobile/ apps/member-mobile/
          ! grep -rn --exclude-dir=node_modules --exclude-dir=.expo --exclude-dir=android --exclude-dir=ios "WHATSAPP_ACCESS_TOKEN" apps/owner-mobile/ apps/member-mobile/
