name: Build GymDeck Windows MSI

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  build_windows:
    name: Build Windows MSI & EXE
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Strawberry Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: "5"
          distribution: strawberry

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Frontend
        run: pnpm run build

      - name: Verify Dist Folder
        shell: pwsh
        run: |
          if (!(Test-Path "dist")) {
            throw "dist folder not found"
          }

      - name: Build Tauri Application (MSI & EXE)
        run: pnpm run tauri build -- --bundles msi,nsis

      - name: Show Build Outputs
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "src-tauri/target/release/bundle") {
            Get-ChildItem src-tauri/target/release/bundle -Recurse
          }

      - name: Upload MSI Installer Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GymDeck-MSI-Installer
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/**/*.msi
          if-no-files-found: warn

      - name: Upload EXE Installer Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GymDeck-EXE-Installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/**/*.exe
          if-no-files-found: warn

