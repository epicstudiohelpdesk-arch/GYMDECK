packages:
  - "apps/*"
  - "backend"
  - "backend/services/*"
  - "backend/shared/*"
  - "backend/workers/*"
  - "packages/*"
  - "tools/*"

allowBuilds:
  core-js: false
  es5-ext: false
  esbuild: true

overrides:
  "esbuild": "0.25.12"
  "@radix-ui/react-dialog": "1.1.6"
  "@radix-ui/react-tabs": "1.1.3"
  "@radix-ui/react-slot": "1.1.2"
  "@radix-ui/react-primitive": "2.0.2"
  "@radix-ui/react-compose-refs": "1.1.1"
