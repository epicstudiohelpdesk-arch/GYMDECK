version: '3.8'

networks:
  postal-staging-net:
    driver: bridge
    internal: false # Requires outbound access for remote MTA direct delivery on port 25

volumes:
  postal-mariadb-data:
    name: gymdeck-postal-staging-mariadb-data

services:
  mariadb:
    image: ${MARIADB_IMAGE:-mariadb:10.11.10}
    container_name: postal-staging-mariadb
    restart: unless-stopped
    networks:
      - postal-staging-net
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-postal}
      MARIADB_USER: ${MARIADB_USER:-postal}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - postal-mariadb-data:/var/lib/mysql
    # MariaDB port is NOT exposed to host for maximum isolation
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  postal-web:
    image: ${POSTAL_IMAGE:-ghcr.io/postalserver/postal:3.4.0}
    platform: linux/amd64
    container_name: postal-staging-web
    restart: unless-stopped
    command: ["postal", "web-server"]
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - postal-staging-net
    volumes:
      - ./config:/config
    ports:
      # Bind strictly to localhost 127.0.0.1
      - "127.0.0.1:${POSTAL_WEB_PORT:-5000}:5000"
    environment:
      POSTAL_CONFIG_FILE_PATH: /config/postal.yml
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  postal-smtp:
    image: ${POSTAL_IMAGE:-ghcr.io/postalserver/postal:3.4.0}
    platform: linux/amd64
    container_name: postal-staging-smtp
    restart: unless-stopped
    command: ["postal", "smtp-server"]
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - postal-staging-net
    volumes:
      - ./config:/config
    ports:
      # Local test SMTP ingress bound to 127.0.0.1
      - "127.0.0.1:${POSTAL_SMTP_PORT:-2525}:25"
    environment:
      POSTAL_CONFIG_FILE_PATH: /config/postal.yml
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 25 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  postal-worker:
    image: ${POSTAL_IMAGE:-ghcr.io/postalserver/postal:3.4.0}
    platform: linux/amd64
    container_name: postal-staging-worker
    restart: unless-stopped
    command: ["postal", "worker"]
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - postal-staging-net
    volumes:
      - ./config:/config
    environment:
      POSTAL_CONFIG_FILE_PATH: /config/postal.yml
