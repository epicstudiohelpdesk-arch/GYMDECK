<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A10" />
      <stop offset="50%" stop-color="#0F1422" />
      <stop offset="100%" stop-color="#06080D" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="ethnoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="35%" stop-color="#818CF8" />
      <stop offset="70%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>

    <!-- Metallic Silver Gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#CBD5E1" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.4" />
      <circle cx="0" cy="0" r="1.5" fill="#38BDF8" fill-opacity="0.3" />
    </pattern>

    <!-- Subtle Scanlines -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.2" opacity="0.3" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur1" />
      <feGaussianBlur stdDeviation="24" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Ethnocentric Styled Font Import -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@800;900&amp;family=Rajdhani:wght@600;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap');

      .ethnocentric-title {
        font-family: 'Orbitron', -apple-system, sans-serif;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.18em;
      }

      .tech-mono {
        font-family: 'Space Grotesk', monospace;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      .sub-badge {
        font-family: 'Rajdhani', sans-serif;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="340" rx="16" fill="url(#techGrid)" />
  <rect width="1200" height="340" rx="16" fill="url(#scanlines)" />

  <!-- Outer Engineered Border & Chamfered Frame -->
  <path d="M 30 16 L 1170 16 A 16 16 0 0 1 1186 32 L 1186 280 L 1150 324 L 30 324 A 16 16 0 0 1 14 308 L 14 32 A 16 16 0 0 1 30 16 Z"
        fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />
  
  <!-- Glowing Neon Accent Corners -->
  <path d="M 14 60 L 14 32 A 16 16 0 0 1 30 16 L 80 16" fill="none" stroke="#60A5FA" stroke-width="3" filter="url(#subtleGlow)" />
  <path d="M 1120 16 L 1170 16 A 16 16 0 0 1 1186 32 L 1186 80" fill="none" stroke="#C084FC" stroke-width="3" filter="url(#subtleGlow)" />
  <path d="M 14 270 L 14 308 A 16 16 0 0 0 30 324 L 80 324" fill="none" stroke="#60A5FA" stroke-width="3" filter="url(#subtleGlow)" />
  <path d="M 1110 324 L 1150 324 L 1186 280 L 1186 240" fill="none" stroke="#F472B6" stroke-width="3" filter="url(#subtleGlow)" />

  <!-- Technical Telemetry Headers (Top Bar) -->
  <g class="tech-mono" font-size="10" fill="#64748B" font-weight="600">
    <text x="40" y="44">SYSTEM: <tspan fill="#38BDF8">ONLINE [TAURI-V2]</tspan></text>
    <text x="320" y="44">CORE: <tspan fill="#A855F7">RUST 1.77+ // SQLCIPHER AES-256</tspan></text>
    <text x="680" y="44">CLIENT: <tspan fill="#34D399">EXPO SDK 58 // REACT NATIVE</tspan></text>
    <text x="1020" y="44">AI: <tspan fill="#F472B6">EDGE CV POSE+MACRO</tspan></text>
  </g>
  <line x1="40" y1="56" x2="1160" y2="56" stroke="#1E293B" stroke-width="1" />

  <!-- Center Decorative Glow Halo -->
  <ellipse cx="600" cy="165" rx="380" ry="85" fill="#4F75E3" fill-opacity="0.12" filter="url(#neonGlow)" />
  <ellipse cx="600" cy="165" rx="200" ry="45" fill="#A855F7" fill-opacity="0.14" filter="url(#neonGlow)" />

  <!-- Ethnocentric Main Logo Mark -->
  <!-- Top decorative horizontal slit / crosshair -->
  <line x1="280" y1="100" x2="920" y2="100" stroke="#475569" stroke-width="1" stroke-dasharray="8 6" opacity="0.4" />
  
  <!-- Primary Ethnocentric Title Text -->
  <text x="600" y="190" text-anchor="middle"
        class="ethnocentric-title"
        font-size="82"
        fill="url(#ethnoGrad)"
        filter="url(#neonGlow)"
        letter-spacing="14px">
    GYMDECK
  </text>
  <text x="600" y="190" text-anchor="middle"
        class="ethnocentric-title"
        font-size="82"
        fill="url(#metalGrad)"
        letter-spacing="14px"
        opacity="0.95">
    GYMDECK
  </text>

  <!-- Horizontal Futuristic Slit / Accent Line cutting through title base -->
  <path d="M 180 205 L 420 205 L 440 215 L 760 215 L 780 205 L 1020 205"
        fill="none" stroke="url(#ethnoGrad)" stroke-width="2" opacity="0.85" filter="url(#subtleGlow)" />
  <circle cx="440" cy="215" r="3" fill="#60A5FA" />
  <circle cx="760" cy="215" r="3" fill="#F472B6" />
  <circle cx="600" cy="215" r="2.5" fill="#FFFFFF" />

  <!-- Subtitle: Engineered Desk Definition -->
  <text x="600" y="254" text-anchor="middle"
        class="tech-mono"
        font-size="13"
        fill="#94A3B8"
        font-weight="700"
        letter-spacing="5px">
    ENGINEERED OPERATIONAL DESK &bull; LOCAL-FIRST ERP &bull; EDGE AI VISION &bull; CLOUD GATEWAY
  </text>

  <!-- Bottom Telemetry Chips / Badges -->
  <g class="sub-badge" font-size="11" transform="translate(0, 275)">
    <!-- Chip 1: Local First -->
    <g transform="translate(140, 0)">
      <rect x="0" y="0" width="180" height="26" rx="13" fill="#1E293B" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
      <circle cx="15" cy="13" r="4" fill="#38BDF8" />
      <text x="28" y="17" fill="#E2E8F0">DESKTOP TAURI V2</text>
    </g>

    <!-- Chip 2: Cloud Gateway -->
    <g transform="translate(350, 0)">
      <rect x="0" y="0" width="220" height="26" rx="13" fill="#1E293B" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
      <circle cx="15" cy="13" r="4" fill="#818CF8" />
      <text x="28" y="17" fill="#E2E8F0">SQLCIPHER AES-256</text>
    </g>

    <!-- Chip 3: Mobile Bento -->
    <g transform="translate(600, 0)">
      <rect x="0" y="0" width="220" height="26" rx="13" fill="#1E293B" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
      <circle cx="15" cy="13" r="4" fill="#C084FC" />
      <text x="28" y="17" fill="#E2E8F0">BENTO MOBILE CLIENT</text>
    </g>

    <!-- Chip 4: Edge AI -->
    <g transform="translate(850, 0)">
      <rect x="0" y="0" width="210" height="26" rx="13" fill="#1E293B" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
      <circle cx="15" cy="13" r="4" fill="#34D399" />
      <text x="28" y="17" fill="#E2E8F0">EDGE COMPUTER VISION</text>
    </g>
  </g>
</svg>
